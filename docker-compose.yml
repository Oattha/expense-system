services:
  app:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - REDIS_URL=redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_new_password
      - POSTGRES_DB=expense_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"